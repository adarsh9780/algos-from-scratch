[project]
name = "algos-from-scratch"
version = "0.1.0"
description = "As part of my learning, I have implemented a few algos from scratch using online courses and LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "torch>=2.14.0",
]

[dependency-groups]
dev = ["ipykernel>=7.3.0"]
